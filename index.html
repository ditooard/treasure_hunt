<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0d06">
  <link rel="icon" href="data:,">
  <title>The Treasure Hunt in My House</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage" id="stage">

    <section class="screen is-active" id="screen-home">
      <img class="screen__bg" src="assets/bg-home.webp" alt="" draggable="false">
      <div class="hud hud--tr">
        <button class="icon-btn" type="button" data-icon="sound" data-audio="sound" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-icon="music" data-audio="music" aria-label="Toggle music"></button>
        <button class="icon-btn" type="button" id="btn-settings" data-icon="gear" aria-label="Settings"></button>
      </div>
      <button class="start-btn" type="button" id="btn-start" aria-label="Start Adventure">
        <img src="assets/button-start.webp" alt="Start Adventure" draggable="false">
      </button>
      <div class="sound-hint" id="sound-hint" hidden>Tap anywhere to hear me!</div>
      <div class="settings" id="settings-panel" hidden>
        <h3>Settings</h3>
        <button class="btn-pill" type="button" id="btn-reset">Reset Progress</button>
        <button class="btn-pill" type="button" id="btn-settings-close">Close</button>
      </div>
    </section>

    <section class="screen" id="screen-level1">
      <img class="screen__bg" src="assets/bg-1.webp" alt="" draggable="false">
      <div class="hud hud--tl">
        <button class="icon-btn" type="button" data-icon="home" data-home aria-label="Home"></button>
      </div>
      <div class="hud hud--tr">
        <button class="icon-btn" type="button" data-icon="sound" data-audio="sound" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-icon="music" data-audio="music" aria-label="Toggle music"></button>
      </div>
      <div class="banner">Find and tap the following objects in the picture!<span class="banner__count" id="l1-progress">0 / 4</span></div>
      <div class="targets" id="l1-targets"></div>
      <div class="scene" id="l1-scene"></div>
    </section>

    <section class="screen" id="screen-level2">
      <img class="screen__bg" src="assets/bg-2.webp" alt="" draggable="false">
      <div class="hud hud--tl">
        <button class="icon-btn" type="button" data-icon="home" data-home aria-label="Home"></button>
      </div>
      <div class="hud hud--tr">
        <button class="icon-btn" type="button" data-icon="sound" data-audio="sound" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-icon="music" data-audio="music" aria-label="Toggle music"></button>
      </div>
      <div class="banner">How many block cubes can you see?</div>
      <div class="scene" id="l2-scene"></div>
      <div class="count-panel">
        <div class="count-block-card"><img src="assets/blue-block.webp" alt="Blue block" draggable="false"></div>
        <div class="numbers" id="l2-numbers"></div>
      </div>
    </section>

    <section class="screen" id="screen-level3">
      <img class="screen__bg" src="assets/bg-3.webp" alt="" draggable="false">
      <div class="hud hud--tl">
        <button class="icon-btn" type="button" data-icon="home" data-home aria-label="Home"></button>
      </div>
      <div class="hud hud--tr">
        <button class="icon-btn" type="button" data-icon="sound" data-audio="sound" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-icon="music" data-audio="music" aria-label="Toggle music"></button>
      </div>
      <div class="banner">Drag the object to its shadow!</div>
      <div class="match-panel">
        <div class="match-objects" id="l3-objects"></div>
        <div class="match-shadows" id="l3-shadows"></div>
      </div>
    </section>

    <section class="screen" id="screen-level4">
      <img class="screen__bg" src="assets/bg-4.webp" alt="" draggable="false">
      <div class="hud hud--tl">
        <button class="icon-btn" type="button" data-icon="home" data-home aria-label="Home"></button>
      </div>
      <div class="hud hud--tr">
        <button class="icon-btn" type="button" data-icon="sound" data-audio="sound" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-icon="music" data-audio="music" aria-label="Toggle music"></button>
      </div>
      <div class="diff-panel" id="l4-panel">
        <div class="diff-pic">
          <img src="assets/lv-4a.webp" alt="Picture A" draggable="false">
          <div class="diff-markers"></div>
        </div>
        <div class="diff-pic">
          <img src="assets/lv-4b.webp" alt="Picture B" draggable="false">
          <div class="diff-markers"></div>
        </div>
      </div>
      <div class="diff-dots" id="l4-dots"></div>
    </section>

    <section class="screen" id="screen-ending">
      <img class="screen__bg" src="assets/ending.webp" alt="" draggable="false">
      <div class="confetti" id="ending-confetti"></div>
      <div class="hud hud--tl">
        <button class="icon-btn" type="button" data-icon="home" data-home aria-label="Home"></button>
      </div>
      <div class="hud hud--tr">
        <button class="icon-btn" type="button" data-icon="sound" data-audio="sound" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-icon="music" data-audio="music" aria-label="Toggle music"></button>
      </div>
      <div class="ending-actions">
        <button class="ending-btn ending-btn--again" type="button" id="btn-play-again">
          <span class="ending-btn__badge"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></span>
          Play Again
        </button>
        <button class="ending-btn ending-btn--next" type="button" id="btn-next-activity">
          <span class="ending-btn__badge"><svg viewBox="0 0 24 24"><path d="M4 11h12.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H4z"/></svg></span>
          Next Activity
        </button>
      </div>
    </section>

    <div class="overlay" id="overlay">
      <div class="confetti" id="confetti"></div>
      <div class="overlay__panel">
        <h2 class="overlay__title" id="overlay-title"></h2>
        <p class="overlay__text" id="overlay-text"></p>
        <div class="overlay__buttons" id="overlay-buttons"></div>
      </div>
    </div>

  </div>

  <div class="rotate-hint">Rotate your device to play</div>

  <script src="js/game.js"></script>
</body>
</html>
